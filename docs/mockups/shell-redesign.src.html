<title>LiteKern Go Shell</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu+Sans:wght@200..800&family=Ubuntu+Sans+Mono:wght@400..600&display=swap">
<style>
/* Layout: a control column beside one real-size A5, keys and all.
   Material: Adwaita's structure (boxed lists, centred titles, symbolic icons,
   pill buttons) on a calm canvas, with liquid glass only on the floating layer.
   The review page is a single dark look; the phone inside has its own theme. */
:root {
  color-scheme: dark;
  --page: #0d0f15; --panel: #161922; --line: #2a2f3c; --text: #e8ebf3; --muted: #98a0b3;
  --accent: #3584e4; --danger: #e0312a;
  --ui: "Ubuntu Sans", system-ui, sans-serif;
  --mono: "Ubuntu Sans Mono", ui-monospace, monospace;
  --spring: cubic-bezier(.2,.9,.25,1.08);
}
html, body { height: 100%; }
body { background: var(--page); color: var(--text); font-family: var(--ui); font-size: 14px; }
.app {
  display: grid; grid-template-columns: minmax(0, 330px) minmax(0, 1fr); gap: 28px; min-height: 100%;
  padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); box-sizing: border-box;
  max-width: 1040px; margin: 0 auto;
}
.side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
.lead { color: var(--muted); margin: 4px 0 0; line-height: 1.45; }
.lbl { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.chip:focus-visible, .key:focus-visible, .pw:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.swatch { width: 30px; height: 30px; padding: 0; border-radius: 50%; border: 2px solid var(--page); box-shadow: 0 0 0 1px var(--line); cursor: pointer; }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px #fff; }
.note { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; line-height: 1.45; }
.note b { font-weight: 600; }
.note p { margin: 0; }
.note p + p { margin-top: 8px; color: var(--muted); }
.picks { display: flex; gap: 8px; align-items: flex-start; }
.picks code { flex: 1; min-width: 0; font-family: var(--mono); font-size: 12px; color: var(--muted); line-height: 1.5; overflow-wrap: anywhere; }
.twoc { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }

.stage { display: flex; justify-content: center; align-items: flex-start; min-width: 0; }
.fit { position: relative; flex: none; }
.device {
  position: absolute; left: 0; top: 0; width: 396px; height: 770px; transform-origin: 0 0;
  background: linear-gradient(160deg, #23262e, #111318); border-radius: 44px;
  box-shadow: 0 0 0 1px #3a3e49, 0 30px 70px rgba(0,0,0,.55);
}
.earpiece { position: absolute; top: 25px; left: 50%; width: 58px; height: 6px; margin-left: -29px; background: #000; border-radius: 4px; box-shadow: inset 0 0 0 1px #2c2f38; }
.pw { position: absolute; right: -4px; top: 218px; width: 5px; height: 62px; padding: 0; border: 0; background: #464a55; border-radius: 0 3px 3px 0; cursor: pointer; }
.keys { position: absolute; left: 18px; right: 18px; top: 696px; height: 62px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; box-sizing: border-box; }
.key { background: none; border: 0; color: #7d8494; width: 62px; height: 42px; display: grid; place-items: center; cursor: pointer; border-radius: 12px; padding: 0; }
.key svg { width: 19px; height: 19px; }
.key.hk { width: 84px; height: 30px; border-radius: 15px; box-shadow: inset 0 0 0 1.5px #3c414d; }

.screen {
  position: absolute; left: 18px; top: 50px; width: 360px; height: 640px; overflow: hidden; background: #000;
  border-radius: 4px; user-select: none; -webkit-user-select: none;
  --canvas: rgba(17,19,26,.56); --card: rgba(255,255,255,.085); --card-solid: #23262f; --sep: rgba(255,255,255,.08);
  --on: #f5f7fc; --dim: rgba(245,247,252,.62);
  --glass: rgba(255,255,255,.10); --glass-strong: rgba(38,41,51,.62);
  --spec: rgba(255,255,255,.38); --shade: rgba(0,0,0,.28); --lift: rgba(0,0,0,.34);
  color: var(--on); font-size: 14px;
}
.screen[data-theme="light"] {
  --canvas: rgba(242,243,248,.8); --card: rgba(255,255,255,.82); --card-solid: #fff; --sep: rgba(0,0,0,.07);
  --on: #16181f; --dim: rgba(22,24,31,.6);
  --glass: rgba(255,255,255,.46); --glass-strong: rgba(255,255,255,.68);
  --spec: rgba(255,255,255,.9); --shade: rgba(0,0,0,.09); --lift: rgba(30,34,50,.16);
}
svg.i { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: block; }

/* the material: a lens over what's behind it */
.lg {
  position: relative; background: var(--glass);
  -webkit-backdrop-filter: blur(14px) saturate(175%); backdrop-filter: blur(14px) saturate(175%);
  box-shadow: inset 0 1px .5px var(--spec), inset 0 -1px .5px var(--shade), inset 0 0 0 .5px rgba(255,255,255,.14), 0 8px 22px var(--lift);
  transition: transform .22s var(--spring), background .16s;
}
.lg::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: radial-gradient(120% 70% at 22% -10%, rgba(255,255,255,.22), transparent 58%), radial-gradient(90% 60% at 88% 118%, rgba(255,255,255,.1), transparent 60%);
}
.lg.strong { background: var(--glass-strong); }
button.lg:active, .lg.press:active { transform: scale(.95); }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .lg { background: var(--card-solid); } }

/* wallpaper layers */
.wall, .frost { position: absolute; inset: 0; background-size: cover; background-position: 50% 50%; }
.frost { inset: -30px; filter: blur(24px) saturate(1.3) brightness(.72); opacity: 0; transition: opacity .3s ease; }
.screen[data-frost="1"] .frost { opacity: 1; }
.screen[data-theme="light"] .frost { filter: blur(24px) saturate(1.2) brightness(1.1); }

.view { position: absolute; inset: 0; opacity: 0; pointer-events: none; transform: scale(.975); transition: opacity .2s ease, transform .3s var(--spring); }
.view.on { opacity: 1; pointer-events: auto; transform: none; }

.bar { position: absolute; left: 0; right: 0; top: 0; height: 28px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 13px; font-weight: 600; z-index: 30; font-variant-numeric: tabular-nums; cursor: pointer; }
.bar .r { display: flex; align-items: center; gap: 6px; font-size: 12px; }
.bar .r svg { width: 15px; height: 15px; }
.batt { width: 22px; height: 11px; border: 1.3px solid currentColor; border-radius: 3.5px; position: relative; box-sizing: border-box; padding: 1.2px; }
.batt i { display: block; height: 100%; width: 82%; background: currentColor; border-radius: 1.2px; }
.batt::after { content: ""; position: absolute; right: -3.6px; top: 2.4px; width: 2px; height: 4px; background: currentColor; border-radius: 0 1px 1px 0; }

/* lock */
.lock { padding: 74px 26px 0; box-sizing: border-box; color: #fff; text-shadow: 0 1px 12px rgba(0,0,0,.3); touch-action: none; cursor: grab; }
.lock .date { font-size: 15px; font-weight: 600; }
.clock { font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.035em; }
.lock .clock { font-size: 112px; line-height: .92; margin: 8px 0 26px -4px; }
.lock[data-clock="inline"] .clock { font-size: 80px; line-height: 1; margin-left: -3px; }
.lnotes { display: flex; flex-direction: column; gap: 8px; }
.lnote { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 20px; font-size: 13px; font-weight: 500; text-shadow: none; color: #fff; }
.lnote img { width: 24px; height: 24px; }
.hint { position: absolute; left: 0; right: 0; bottom: 26px; text-align: center; font-size: 13px; }
.hint svg { width: 18px; height: 18px; margin: 0 auto 2px; animation: nudge 2.2s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateY(-5px); } }

/* pin */
.pin { color: #fff; display: flex; flex-direction: column; align-items: center; padding-top: 112px; box-sizing: border-box; }
.pin .t { font-size: 17px; font-weight: 600; margin-bottom: 18px; }
.dots { display: flex; gap: 16px; height: 14px; margin-bottom: 40px; }
.dots i { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.75); transition: background .1s; }
.dots i.f { background: #fff; }
.dots.bad { animation: shake .34s; }
@keyframes shake { 20% { transform: translateX(-9px); } 45% { transform: translateX(8px); } 70% { transform: translateX(-5px); } }
.pad { display: grid; grid-template-columns: repeat(3, 72px); gap: 12px 22px; }
.pk { width: 72px; height: 72px; border: 0; border-radius: 50%; font: inherit; font-size: 28px; font-weight: 500; color: #fff; cursor: pointer; }
.pk.t2 { font-size: 14px; font-weight: 600; background: none; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
.pk.t2::before { display: none; }

/* home */
.home { padding: 56px 22px 0; box-sizing: border-box; color: #fff; }
.home .clock { font-size: 60px; line-height: 1; text-shadow: 0 1px 12px rgba(0,0,0,.28); margin-left: -2px; }
.home .date { font-size: 14px; font-weight: 500; margin-top: 3px; text-shadow: 0 1px 6px rgba(0,0,0,.4); }
.grid { position: absolute; left: 12px; right: 12px; display: grid; grid-template-columns: repeat(4, 1fr); row-gap: 16px; }
.ic { background: none; border: 0; padding: 0; font: inherit; color: #fff; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; min-width: 0; }
.ic:active .gl { transform: scale(.9); }
.gl { width: 58px; height: 58px; display: grid; place-items: center; transition: transform .16s var(--spring); border-radius: 18px; }
.gl img { width: 58px; height: 58px; position: relative; }
.plates .gl { box-shadow: inset 0 1px .5px var(--spec), inset 0 -1px .5px var(--shade), 0 5px 14px var(--lift); background: rgba(255,255,255,.14); -webkit-backdrop-filter: blur(12px) saturate(170%); backdrop-filter: blur(12px) saturate(170%); }
.plates .gl img { width: 44px; height: 44px; }
.ic .lab { font-size: 11.5px; font-weight: 500; max-width: 80px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 4px rgba(0,0,0,.55); }
.dockb { position: absolute; left: 10px; right: 10px; bottom: 12px; height: 88px; border-radius: 32px; display: grid; grid-template-columns: repeat(4, 1fr); align-items: center; }
.dockb .ic .lab { display: none; }
.pdots { position: absolute; left: 0; right: 0; display: flex; gap: 7px; justify-content: center; }
.pdots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.4); }
.pdots i:first-child { background: #fff; }

/* recents */
.recents { color: #fff; }
.rtitle { position: absolute; top: 46px; left: 24px; font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
.rail { position: absolute; left: 0; right: 0; top: 92px; height: 450px; display: flex; gap: 16px; overflow-x: auto; overflow-y: visible; scroll-snap-type: x mandatory; padding: 4px 72px; box-sizing: border-box; scrollbar-width: none; touch-action: pan-x; }
.rail::-webkit-scrollbar { display: none; }
.card { flex: none; width: 216px; scroll-snap-align: center; display: flex; flex-direction: column; gap: 10px; transition: transform .28s var(--spring), opacity .22s; cursor: pointer; }
.card.go { transform: translateY(-120%); opacity: 0; }
.card .h { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; height: 26px; }
.card .h img { width: 24px; height: 24px; }
.card .s { position: relative; width: 216px; height: 384px; border-radius: 26px; overflow: hidden; background: #14161d; box-shadow: 0 0 0 1px rgba(255,255,255,.3), inset 0 1px 0 rgba(255,255,255,.3), 0 18px 40px rgba(0,0,0,.45); }
.mini { position: absolute; left: 0; top: 0; width: 360px; height: 640px; transform: scale(.6); transform-origin: 0 0; pointer-events: none; }
.empty { position: absolute; left: 0; right: 0; top: 280px; text-align: center; color: rgba(255,255,255,.8); }
.pillb { position: absolute; left: 50%; bottom: 34px; margin-left: -62px; width: 124px; height: 46px; border: 0; font: inherit; font-weight: 600; font-size: 14px; color: #fff; border-radius: 999px; cursor: pointer; }

/* quick settings */
.qs { padding: 42px 12px 0; box-sizing: border-box; color: var(--on); display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
.qhead { display: flex; align-items: flex-end; justify-content: space-between; padding: 0 10px 2px; }
.qhead .t { font-size: 36px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1; }
.qhead .d { font-size: 13px; font-weight: 500; color: var(--dim); margin-top: 3px; }
.rb { border: 0; color: var(--on); width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; font-size: 19px; padding: 0; flex: none; }
.panel { border-radius: 28px; padding: 14px 12px; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px 4px; position: relative; }
.tile { background: none; border: 0; color: var(--on); font: inherit; font-size: 10.5px; font-weight: 500; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; padding: 0; min-width: 0; }
.tile i { width: 50px; height: 50px; border-radius: 50%; background: var(--card); color: var(--on); display: grid; place-items: center; font-size: 22px; transition: background .16s, color .16s; }
.tile[aria-pressed="true"] i { background: var(--accent); color: #fff; }
.tile span { max-width: 74px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.sl { display: flex; align-items: center; gap: 10px; font-size: 19px; color: var(--dim); padding: 3px 4px; position: relative; }
input[type=range] { appearance: none; -webkit-appearance: none; flex: 1; min-width: 0; height: 26px; border-radius: 13px; background: linear-gradient(90deg, var(--accent) var(--v, 60%), var(--card) var(--v, 60%)); cursor: pointer; margin: 0; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
input[type=range]::-moz-range-thumb { width: 26px; height: 26px; border: 0; border-radius: 50%; background: #fff; }
.qn { display: flex; gap: 10px; align-items: center; padding: 10px 12px; position: relative; }
.qn img { width: 34px; height: 34px; }
.qn b { font-weight: 600; font-size: 13.5px; display: block; }
.qn small { color: var(--dim); font-size: 12px; }
.clear { align-self: center; background: none; border: 0; font: inherit; font-size: 13px; font-weight: 600; color: var(--on); cursor: pointer; padding: 8px 14px; }

/* power */
.power { color: #fff; }
.pstack { position: absolute; right: 14px; top: 150px; display: flex; flex-direction: column; gap: 14px; }
.pbtn { background: none; border: 0; color: #fff; font: inherit; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: flex-end; gap: 14px; cursor: pointer; padding: 0; }
.pbtn i { width: 68px; height: 68px; border-radius: 50%; display: grid; place-items: center; font-size: 26px; }
.pbtn.off i { background: rgba(224,49,42,.82); }
.pbtn:active i { transform: scale(.92); }

/* apps: a calm canvas, Adwaita's lists, glass only on what floats */
.appv { color: var(--on); }
.appcv { position: absolute; inset: 0; background: var(--canvas); }
.scroll { position: absolute; inset: 0; overflow-y: auto; padding: 90px 12px 104px; box-sizing: border-box; scrollbar-width: none; touch-action: pan-y; }
.scroll::-webkit-scrollbar { display: none; }
.hb { position: absolute; left: 10px; right: 10px; top: 32px; height: 50px; border-radius: 25px; display: flex; align-items: center; justify-content: space-between; padding: 0 4px; z-index: 5; }
.hb .tt { position: absolute; left: 56px; right: 56px; text-align: center; font-size: 15.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
.hbtn { background: none; border: 0; color: var(--on); width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-size: 19px; cursor: pointer; padding: 0; position: relative; }
.hbtn:active { background: var(--card); }
.h1 { font-size: 30px; font-weight: 800; letter-spacing: -.025em; padding: 2px 8px 12px; }
.sec { font-size: 12.5px; font-weight: 700; color: var(--dim); padding: 12px 8px 7px; }
.bl { background: var(--card); border-radius: 20px; overflow: hidden; margin-bottom: 10px; }
.row { display: flex; align-items: center; gap: 13px; padding: 0 14px; min-height: 56px; width: 100%; box-sizing: border-box; background: none; border: 0; font: inherit; color: var(--on); text-align: left; cursor: pointer; }
button.row:active { background: var(--sep); }
.row + .row { box-shadow: 0 -1px 0 var(--sep); }
.row .ti { flex: 1; min-width: 0; padding: 8px 0; }
.row b { font-weight: 600; font-size: 15px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row small { display: block; font-size: 12.5px; color: var(--dim); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row > svg { font-size: 21px; flex: none; }
.row .fold { color: var(--accent); }
.row .chev { color: var(--dim); font-size: 16px; }
.dot { width: 34px; height: 34px; border-radius: 50%; background: var(--c, var(--accent)); color: #fff; display: grid; place-items: center; font-size: 18px; flex: none; }
.sw { width: 46px; height: 28px; border-radius: 14px; background: var(--sep); box-shadow: inset 0 0 0 1px var(--sep); position: relative; border: 0; padding: 0; cursor: pointer; flex: none; transition: background .16s; }
.sw::after { content: ""; position: absolute; left: 2px; top: 2px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.35); transition: transform .24s var(--spring); }
.sw[aria-checked="true"] { background: var(--accent); }
.sw[aria-checked="true"]::after { transform: translateX(18px); }
.btn { font: inherit; font-weight: 600; font-size: 14.5px; color: var(--on); background: var(--card); border: 0; height: 44px; padding: 0 20px; border-radius: 22px; cursor: pointer; }
.btn.sug { background: var(--accent); color: #fff; }
.btn.des { background: rgba(224,49,42,.9); color: #fff; }
.btn:active { filter: brightness(1.15); }
.bot { position: absolute; left: 12px; right: 12px; bottom: 14px; display: flex; gap: 8px; z-index: 5; }
.bot .btn { flex: 1; }
.gbtn { font: inherit; font-weight: 600; font-size: 14px; color: var(--on); border: 0; height: 50px; flex: 1; border-radius: 25px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
.gbtn svg { font-size: 18px; position: relative; }
.gbtn.sug { background: color-mix(in srgb, var(--accent) 78%, transparent); color: #fff; }
.vs { position: absolute; left: 34px; right: 34px; bottom: 14px; height: 54px; border-radius: 27px; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 4px; box-sizing: border-box; z-index: 5; }
.vs .th { position: absolute; top: 4px; bottom: 4px; left: 4px; border-radius: 23px; background: var(--card); box-shadow: inset 0 1px .5px var(--spec); transition: transform .32s var(--spring); }
.vs button { position: relative; background: none; border: 0; color: var(--dim); font: inherit; font-size: 11px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; cursor: pointer; padding: 0; }
.vs button svg { font-size: 19px; }
.vs button[aria-selected="true"] { color: var(--accent); }
.screen[data-theme="dark"] .vs button[aria-selected="true"] { color: #fff; }

/* calculator */
.cdisp { position: absolute; left: 12px; right: 12px; top: 92px; height: 168px; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end; padding: 0 14px 12px; box-sizing: border-box; }
.cdisp small { font-size: 15px; color: var(--dim); min-height: 20px; }
.cdisp b { font-size: 60px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.05; max-width: 100%; overflow: hidden; }
.cgrid { position: absolute; left: 12px; right: 12px; bottom: 14px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; justify-items: center; }
.ck { width: 72px; height: 66px; border: 0; border-radius: 33px; background: var(--card); color: var(--on); font: inherit; font-size: 24px; font-weight: 500; cursor: pointer; display: grid; place-items: center; }
.ck:active { filter: brightness(1.3); }
.ck.op { color: var(--accent); font-weight: 700; }
.screen[data-theme="dark"] .ck.op { color: #9cc4f4; }
.ck.fn { font-size: 16px; font-weight: 700; }
.ck.eq { background: var(--accent); color: #fff; font-weight: 700; }
.ck svg { font-size: 23px; }

/* clock */
.bigt { font-size: 64px; font-weight: 800; letter-spacing: -.035em; font-variant-numeric: tabular-nums; text-align: center; padding: 40px 0 26px; }
.alt { font-size: 28px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; display: block; }
.pair { display: flex; gap: 8px; justify-content: center; }
.pair .btn { min-width: 110px; }
.presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 18px; }

/* gallery */
.ggrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; border-radius: 20px; overflow: hidden; }
.gi { border: 0; padding: 0; aspect-ratio: 9/16; background: var(--card) center/cover; cursor: pointer; }
.gv { position: absolute; inset: 0; background: #000 center/contain no-repeat; }

/* web */

/* task manager */
.mem { padding: 14px 16px; }

.mbar { height: 10px; border-radius: 5px; background: var(--sep); overflow: hidden; margin-top: 10px; }
.mbar i { display: block; height: 100%; background: var(--accent); border-radius: 5px; }
.small { height: 34px; padding: 0 14px; font-size: 13px; flex: none; }

/* log */
.logv { font-family: var(--mono); font-size: 11.5px; line-height: 1.65; padding: 10px 12px; }
.logv div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.logv i { font-style: normal; color: var(--dim); }

/* blocksmith */
.bstage { height: 152px; border-radius: 20px; background: linear-gradient(170deg, #7fb9ee, #bfe4c2); position: relative; overflow: hidden; margin-bottom: 12px; }
.bcat { position: absolute; left: 44%; bottom: 16px; width: 44px; height: 44px; border-radius: 13px; background: #f6c84b; box-shadow: inset 0 -5px 0 rgba(0,0,0,.14); }
.bsay { position: absolute; left: 50%; top: 22px; transform: translateX(-50%); background: #fff; color: #16181f; font-size: 13px; font-weight: 600; padding: 7px 12px; border-radius: 14px; white-space: nowrap; }
.blk { display: inline-block; padding: 10px 14px; border-radius: 12px; color: #fff; font-size: 14px; font-weight: 600; margin-bottom: 3px; background: var(--c); }

.blks { display: flex; flex-direction: column; align-items: flex-start; padding: 8px; }

.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.34); z-index: 9; display: flex; opacity: 0; pointer-events: none; transition: opacity .2s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet { position: absolute; left: 10px; right: 10px; bottom: 12px; border-radius: 30px; padding: 8px; z-index: 10; transform: translateY(calc(100% + 24px)); visibility: hidden; transition: transform .36s var(--spring), visibility 0s .36s; }
.sheet.on { transform: none; visibility: visible; transition: transform .4s var(--spring); }
.sheet .bl { background: none; margin: 0; position: relative; }
.sheet .st { text-align: center; font-size: 13px; font-weight: 600; color: var(--dim); padding: 8px 0 4px; position: relative; }
.dlg { margin: auto 34px; flex: 1; border-radius: 30px; padding: 22px 18px 14px; text-align: center; transform: scale(.92); transition: transform .3s var(--spring); }
.scrim.on .dlg { transform: none; }
.dlg b { font-size: 17px; font-weight: 700; display: block; position: relative; }
.dlg p { margin: 6px 0 16px; color: var(--dim); line-height: 1.4; position: relative; }
.dlg .acts { display: flex; gap: 8px; position: relative; }
.dlg .btn { flex: 1; padding: 0; }
.toast { position: absolute; left: 50%; bottom: 84px; transform: translate(-50%, 16px); max-width: 300px; padding: 10px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; opacity: 0; transition: opacity .2s, transform .3s var(--spring); z-index: 20; white-space: nowrap; pointer-events: none; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* the apps screen, up from home as quick settings comes down */
.drawer { color: var(--on); padding: 40px 14px 0; box-sizing: border-box; overflow-y: auto; scrollbar-width: none; }

.dsearch { height: 46px; border-radius: 23px; display: flex; align-items: center; gap: 8px; padding: 0 14px; margin-bottom: 16px; color: var(--dim); }
.dsearch svg { font-size: 18px; position: relative; }
.dsearch input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; font: inherit; color: var(--on); position: relative; }

.qs:not(.on) { transform: translateY(-46px); }
.drawer:not(.on) { transform: translateY(70px); }
.power:not(.on) { transform: translateX(26px); }
.home:not(.on) { transform: scale(.94); }
.appv { overflow: hidden; }
.view.under { opacity: 1; pointer-events: none; transform: scale(.965); filter: blur(9px) brightness(.72); transition: opacity .2s, transform .32s var(--spring), filter .26s; }

@keyframes rise { from { opacity: 0; transform: translateY(16px) scale(.97); } }
@keyframes popi { from { opacity: 0; transform: scale(.72); } }
@keyframes fromr { from { opacity: 0; transform: translateX(34px) scale(.9); } }
@keyframes fromt { from { opacity: 0; transform: translateY(-20px) scale(.97); } }
@keyframes push { from { opacity: 0; transform: translateX(46px); } }
@keyframes pull { from { opacity: 0; transform: translateX(-46px); } }
@keyframes tabin { from { opacity: 0; transform: translateY(10px); } }
.scroll.push { animation: push .36s var(--spring); }
.scroll.pop { animation: pull .36s var(--spring); }
.scroll.tab { animation: tabin .28s ease-out; }
.ck, .btn, .gbtn, .hbtn, .rb, .pk, .tile i, .fav i, .gi, .sw::after, .row { transition: transform .22s var(--spring), background .16s, filter .16s; }
.ck:active, .btn:active, .gi:active, .fav:active i, .tile:active i { transform: scale(.92); }
.hbtn:active, .rb:active { transform: scale(.88); }
.pk:active { transform: scale(.9); }
.bl, .appcv, .row, .tile i, .sw, .ck { transition-property: transform, background, filter, color; transition-duration: .22s; }
.cdisp b { transition: font-size .18s; display: block; }
.cdisp b.bump { animation: tabin .18s ease-out; }
@media (prefers-reduced-motion: reduce) {
  .scroll.push, .scroll.pop, .scroll.tab { animation: none; }
  .view.under { filter: none; }
}

.before { position: absolute; inset: 0; z-index: 50; background-size: cover; display: none; }
.before.on { display: block; }
.tag { position: absolute; z-index: 51; left: 50%; top: 40px; transform: translateX(-50%); padding: 4px 10px; font: 500 11px var(--mono); letter-spacing: .08em; border-radius: 999px; background: #d9352f; color: #fff; display: none; }
.tag.on { display: block; }

@media (max-width: 800px) {
  .app { display: flex; flex-direction: column; gap: 16px; }

}

function calcKey(a) {
  const c = T.calc, [cmd, v] = a.split(":");
  const f = n => { const r = Math.round(n * 1e10) / 1e10; return String(r); };
  const run = () => { const x = +c.a, y = +c.cur; return c.op === "+" ? x + y : c.op === "-" ? x - y : c.op === "*" ? x * y : y === 0 ? NaN : x / y; };
  if (c.cur === "Can't divide by 0" && cmd !== "clr") { c.cur = "0"; c.fresh = true; }
  if (cmd === "n") { c.cur = c.fresh || c.cur === "0" ? v : (c.cur.length < 12 ? c.cur + v : c.cur); c.fresh = false; }
  else if (cmd === "dot") { if (c.fresh) { c.cur = "0."; c.fresh = false; } else if (!c.cur.includes(".")) c.cur += "."; }
  else if (cmd === "clr") { Object.assign(c, { a: null, op: null, cur: "0", hist: "", fresh: true }); }
  else if (cmd === "del") { if (!c.fresh) { c.cur = c.cur.slice(0, -1) || "0"; if (c.cur === "0") c.fresh = true; } }
  else if (cmd === "neg") { if (c.cur !== "0") c.cur = c.cur[0] === "-" ? c.cur.slice(1) : "-" + c.cur; }
  else if (cmd === "pct") { c.cur = f(+c.cur / 100); c.fresh = true; }
  else if (cmd === "op" || cmd === "eq") {
    if (c.op && !(cmd === "op" && c.fresh)) {
      const r = run(), sym = { "+": "+", "-": "−", "*": "×", "/": "÷" }[c.op];
      c.hist = `${c.a} ${sym} ${c.cur} =`;
      c.cur = Number.isNaN(r) ? "Can't divide by 0" : f(r);
    }
    if (cmd === "op") { c.a = c.cur; c.op = v; c.hist = `${c.a} ${{ "+": "+", "-": "−", "*": "×", "/": "÷" }[v]}`; } else { c.op = null; c.a = null; }
    c.fresh = true;
  }
}

function closeOver() { $("sheet").classList.remove("on"); $("scrim").classList.remove("on"); }
function dialog(title, body, yes, act) {
  $("scrim").innerHTML = `<div class="dlg lg strong" role="dialog" aria-label="${title}"><b>${title}</b><p>${body}</p><div class="acts"><button class="btn" type="button" data-act="over">Cancel</button><button class="btn des" type="button" data-act="${act}">${yes}</button></div></div>`;
  $("scrim").classList.add("on");
}
let toastT;
function toast(t) { const e = $("toast"); e.textContent = t; e.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove("on"), 1700); }
function fileSheet(n) {
  $("sheet").innerHTML = `<div class="st">${n}</div><div class="bl"><button class="row" type="button" data-act="ftoast:Opened">${ic("file")}<span class="ti"><b>Open</b></span></button><button class="row" type="button" data-act="ftoast:Rename isn't in the mockup">${ic("redo")}<span class="ti"><b>Rename</b></span></button><button class="row" type="button" data-act="fdel:${n}" style="color:var(--danger)">${ic("trash")}<span class="ti"><b>Delete</b></span></button></div>`;
  $("scrim").innerHTML = ""; $("scrim").classList.add("on"); $("sheet").classList.add("on");
}

let base = "home";                                  // what's under an overlay
function stagger(v) {
  const st = STAG[v], root = $("v-" + v);
  if (REDUCED || !st || !root) return;
  root.querySelectorAll(st[0]).forEach((e, i) => {
    e.style.animation = "none"; void e.offsetWidth;
    e.style.animation = `${st[1]} .44s var(--spring) ${i * st[2]}ms both`;
    e.addEventListener("animationend", () => { e.style.animation = ""; }, { once: true });
  });
}
function go(v, quiet) {
  endClose();
  if (S.view !== v && !OVER.includes(S.view)) base = S.view;
  const over = OVER.includes(v);
  S.view = v; save();
  document.querySelectorAll(".view").forEach(e => {
    e.classList.toggle("on", e.id === "v-" + v);
    e.classList.toggle("under", over && e.id === "v-" + base);
  });
  $("screen").dataset.frost = ["pin","recents","qs","power","app","drawer"].includes(v) ? 1 : 0;
  if (!quiet) stagger(v);
  $("barT").textContent = v === "lock" || v === "pin" ? "" : `${HH}:${MM}`;
  const onGlass = (v === "app" && !(S.app === "gallery" && T.gal.open != null)) || v === "qs" || v === "drawer";
  $("bar").style.color = onGlass ? "var(--on)" : "#fff";
  if (v === "pin") { code = ""; dots(); }
  if (v === "recents") renderRecents();
  if (v === "app") drawApp();
  closeOver();
  renderTabs(); renderNote(); renderBefore();
}
function dots() { const d = $("dots"); if (d) [...d.children].forEach((e, i) => e.classList.toggle("f", i < code.length)); }
const key = () => S.view === "app" ? S.app : S.view;

function chips(id, items, k, after) {
  const box = $(id); box.innerHTML = "";
  items.forEach(([label, val, swatch]) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = swatch ? "swatch" : "chip"; b.setAttribute("aria-pressed", String(S[k] === val));
    if (swatch) { b.style.background = val; b.setAttribute("aria-label", label); b.title = label; } else b.textContent = label;
    b.onclick = () => { S[k] = val; apply(); };
    box.append(b);
  });
}
function renderTabs() {
  const mk = (box, list, on, fn) => { const b = $(box); b.innerHTML = ""; list.forEach(([v, l]) => { const c = document.createElement("button"); c.type = "button"; c.className = "chip"; c.textContent = l; c.setAttribute("aria-pressed", String(on === v)); c.onclick = () => fn(v); b.append(c); }); };
  mk("tabs", VIEWS, S.view, go);
  mk("atabs", APPS, S.view === "app" ? S.app : null, openApp);
}
function renderNote() { const n = NOTES[key()]; $("note").innerHTML = n ? `<p><b>${n[0]}</b></p><p>${n[1]}</p>` : ""; }
function renderBefore() {
  const b = BEFORE[key()], on = !!S.before && !!b;
  $("before").style.backgroundImage = b ? `url(${A[b]})` : "";
  $("before").classList.toggle("on", on); $("tag").classList.toggle("on", on);
  $("tag").textContent = "CURRENT SHELL";
}
function picks() { return `theme ${S.theme}, accent ${accentName(S.accent).toLowerCase()}, wallpaper ${S.wall}, icons ${S.plates ? "on plates" : "as they are"}, dock ${S.dock ? "on" : "off"}, clock ${S.clock}`; }

function apply() {
  save();
  document.documentElement.style.setProperty("--accent", S.accent);
  $("screen").dataset.theme = S.theme;
  const w = A["w-" + S.wall + (S.theme === "light" ? "-light" : "")] || A["w-" + S.wall];
  $("wall").style.backgroundImage = $("frost").style.backgroundImage = `url(${w})`;
  chips("o-before", [["New",0],["Current",1]], "before");
  chips("o-theme", [["Dark","dark"],["Light","light"]], "theme");
  chips("o-accent", ACCENTS.map(a => [a[0], a[1], 1]), "accent");
  chips("o-wall", [["Crossing","crossing"],["Aurora","aurora"],["Drift","drift"],["Dusk","dusk"]], "wall");
  chips("o-plates", [["As they are",0],["On plates",1]], "plates");
  chips("o-dock", [["On",1],["Off",0]], "dock");
  chips("o-clock", [["Stacked","stacked"],["One line","inline"]], "clock");
  renderLock(); renderPin(); renderHome(); renderDrawer(); renderQs(); renderPower();
  $("picks").textContent = picks();
  go(S.view, true);
}

// Stopwatch and timer tick
setInterval(() => {
  const c = T.clk, t = $("clkT");
  if (c.tmOn) { const left = Math.ceil((c.tmEnd - Date.now()) / 1000); c.tmLeft = Math.max(left, 0); if (left <= 0) { c.tmOn = false; c.tmLeft = 0; toast("Timer finished"); if (S.view === "app" && S.app === "clock") drawApp(); } }
  if (!t || S.view !== "app" || S.app !== "clock") return;
  if (c.tab === "stop" && c.swOn) { const ms = c.sw + Date.now() - c.swT, q = Math.floor(ms / 10); t.textContent = `${String(Math.floor(q / 6000)).padStart(2, "0")}:${String(Math.floor(q / 100) % 60).padStart(2, "0")}.${String(q % 100).padStart(2, "0")}`; }
  if (c.tab === "timer" && c.tmOn) t.textContent = `${String(Math.floor(c.tmLeft / 60)).padStart(2, "0")}:${String(c.tmLeft % 60).padStart(2, "0")}`;
}, 50);

// Everything tappable in an app
function act(a, el) {
  const i = a.indexOf(":"), cmd = i < 0 ? a : a.slice(0, i), arg = i < 0 ? "" : a.slice(i + 1);
  const c = T.clk;
  const flip = () => { if (el) el.setAttribute("aria-checked", el.getAttribute("aria-checked") === "true" ? "false" : "true"); };
  switch (cmd) {
    case "toast": return toast(arg);
    case "over": return closeOver();
    case "dir": T.files.dir = T.files.dir && arg === "Screenshots" ? "Pictures/Screenshots" : arg; T.files.items["Pictures/Screenshots"] = T.files.items["Pictures/Screenshots"] || [["Screenshot_1.png",0,"412 KB"],["Screenshot_2.png",0,"388 KB"],["Screenshot_3.png",0,"401 KB"]]; T.files.items.Camera = T.files.items.Camera || []; return drawApp("push");
    case "updir": T.files.dir = T.files.dir && T.files.dir.includes("/") ? "Pictures" : ["Screenshots","Camera"].includes(T.files.dir) ? "Pictures" : null; return drawApp("pop");
    case "fsheet": return fileSheet(arg);
    case "ftoast": closeOver(); return toast(arg);
    case "fdel": { closeOver(); const n = arg; return dialog("Delete this file?", n, "Delete", "fdel2:" + n); }
    case "fdel2": { const d = T.files.dir || ""; T.files.items[d] = T.files.items[d].filter(x => x[0] !== arg); closeOver(); break; }
    case "c": {                                     // only the display changes, so keys keep their press
      calcKey(arg);
      const d = $("v-app").querySelector(".cdisp"), b = d.querySelector("b"), cc = T.calc;
      d.querySelector("small").innerHTML = cc.hist || "&nbsp;";
      b.textContent = cc.cur; b.style.fontSize = (cc.cur.length > 12 ? 26 : cc.cur.length > 8 ? 40 : 60) + "px";
      if (/^(eq|op|clr)/.test(arg) && !REDUCED) { b.classList.remove("bump"); void b.offsetWidth; b.classList.add("bump"); }
      return;
    }
    case "spage": T.set.page = arg || null; return drawApp(arg ? "push" : "pop");
    case "stog": T.set[arg] = !T.set[arg]; return flip();
    case "theme": S.theme = arg; return apply();
    case "accent": S.accent = arg; return apply();
    case "ctab": {                                  // the pill slides from the old tab to the new one
      const old = ["alarm", "timer", "stop"].indexOf(c.tab);
      c.tab = arg; drawApp("tab");
      const th = $("v-app").querySelector(".vs .th");
      if (th && !REDUCED) { const end = th.style.transform; th.style.transition = "none"; th.style.transform = `translateX(${old * 100}%)`; void th.offsetWidth; th.style.transition = ""; th.style.transform = end; }
      return;
    }
    case "calarm": c.alarms[+arg][2] = !c.alarms[+arg][2]; return flip();
    case "cset": c.tm = +arg; c.tmLeft = 0; c.tmOn = false; break;
    case "ctm": if (c.tmOn) { c.tmOn = false; } else { c.tmEnd = Date.now() + (c.tmLeft || c.tm) * 1000; c.tmOn = true; } break;
    case "css": if (c.swOn) { c.sw += Date.now() - c.swT; c.swOn = false; } else { c.swT = Date.now(); c.swOn = true; } break;
    case "csr": c.sw = 0; c.swOn = false; break;
    case "brun": T.blk.said = true; drawApp(); clearTimeout(T.blk.t); T.blk.t = setTimeout(() => { T.blk.said = false; if (S.app === "blocksmith") drawApp(); }, 2400); return;
    case "gopen": {                                 // the picture grows out of its thumbnail
      const r = el ? rectOf(el) : null;
      T.gal.open = +arg; go("app", true);
      const g = $("v-app").querySelector(".gv");
      if (g && r && !REDUCED) g.animate([{ transformOrigin: "0 0", transform: at(r), borderRadius: "24px" }, { transformOrigin: "0 0", transform: "none", borderRadius: "0" }], { duration: 400, easing: "cubic-bezier(.2,.9,.25,1.02)" });
      return;
    }
    case "gclose": T.gal.open = null; go("app", true); { const s = $("v-app").querySelector(".scroll"); if (s && !REDUCED) s.classList.add("tab"); } return;
    case "gwall": { const w = arg.startsWith("w-") ? arg.slice(2) : null; if (w) { S.wall = w; apply(); toast("Wallpaper set"); } else toast("Screenshots can't be wallpaper here"); return; }
    case "gdel": return dialog("Delete this picture?", "It can't be brought back.", "Delete", "gdel2");
    case "gdel2": T.gal.list.splice(T.gal.open, 1); T.gal.open = null; closeOver(); go("app"); return;
    case "tstop": return dialog("Stop " + name(arg) + "?", "Anything you haven't saved will be lost.", "Stop", "tstop2:" + arg);
    case "tstop2": opened = opened.filter(o => o !== arg); closeOver(); break;
    default: return;
  }
  drawApp();
}

// Keys
$("k-home").onclick = goHome;
$("k-rec").onclick = () => (S.view === "recents" ? go("home") : goRecents());
$("k-back").onclick = () => {
  if ($("scrim").classList.contains("on")) return closeOver();
  if (S.view === "app") {
    if (S.app === "files" && T.files.dir) return act("updir");
    if (S.app === "settings" && T.set.page) return act("spage:");
    if (S.app === "gallery" && T.gal.open != null) return act("gclose");
    return goHome();
  }
  if (OVER.includes(S.view)) return go(base);
  go(S.view === "pin" ? "lock" : S.view === "lock" ? "lock" : "home");
};
$("pw").onclick = () => go(S.view === "power" ? base : "power");
$("bar").onclick = () => go(S.view === "qs" ? base : "qs");
$("scrim").addEventListener("click", e => { if (e.target.id === "scrim") closeOver(); });
$("screen").addEventListener("submit", e => { e.preventDefault(); toast("Pages can't load in the mockup"); });
$("screen").addEventListener("click", e => {
  const a = e.target.closest("[data-act]"); if (a) { e.preventDefault(); return act(a.dataset.act, a); }
  const o = e.target.closest("[data-open]"); if (o) return openApp(o.dataset.open, o.querySelector(".gl"));
  const k = e.target.closest("[data-k]");
  if (k) {
    const v = k.dataset.k;
    if (v === "c") return go("lock");
    if (v === "x") { code = code.slice(0, -1); return dots(); }
    if (code.length < 4) code += v; dots();
    if (code.length === 4) setTimeout(() => {
      if (code === "1234") return go("home");
      const d = $("dots"); d.classList.add("bad"); setTimeout(() => { d.classList.remove("bad"); code = ""; dots(); }, 340);
    }, 140);
    return;
  }
  const t = e.target.closest("[data-t]");
  if (t) {
    if (t.dataset.t === "moon") { S.theme = S.theme === "dark" ? "light" : "dark"; return apply(); }
    t.setAttribute("aria-pressed", t.getAttribute("aria-pressed") === "true" ? "false" : "true"); return;
  }
  if (e.target.closest("#qgear")) return openApp("settings");
  if (e.target.closest("#plock")) return go("lock");
  if (e.target.closest("#closeall")) {
    const cards = [...document.querySelectorAll("#v-recents .card")];
    cards.reverse().forEach((c, i) => setTimeout(() => c.classList.add("go"), i * 50));
    return setTimeout(() => { opened = []; go("home"); }, REDUCED ? 0 : 200 + cards.length * 50);
  }
  if (e.target.id === "v-power" || e.target.id === "v-qs") return go(base);
});

// Pulls: quick settings comes down from the top, all apps comes up from home,
// and either follows the finger the whole way
(function () {
  const SC = $("screen"), OPEN = 200;
  let p = null, swallow = false;
  const y = e => { const s = SC.getBoundingClientRect(); return (e.clientY - s.top) * 360 / s.width; };
  SC.addEventListener("pointerdown", e => {
    swallow = false; const Y = y(e), v = S.view;
    if ((v === "home" || v === "app") && Y < 44) p = { name: "qs", sign: 1, y0: Y, opening: true, id: e.pointerId };
    else if (v === "home" && !e.target.closest(".lock")) p = { name: "drawer", sign: -1, y0: Y, opening: true, id: e.pointerId };
    else if (v === "qs") p = { name: "qs", sign: -1, y0: Y, opening: false, id: e.pointerId };
    else if (v === "drawer" && $("v-drawer").scrollTop <= 0 && !e.target.closest("input")) p = { name: "drawer", sign: 1, y0: Y, opening: false, id: e.pointerId };
    else p = null;
  }, true);
  SC.addEventListener("pointermove", e => {
    if (!p) return;
    const d = (y(e) - p.y0) * p.sign, el = $("v-" + p.name), dist = p.name === "qs" ? -80 : 120;
    if (!p.live) {
      if (d < 10) return;
      p.live = true; swallow = true; SC.setPointerCapture(p.id); el.classList.add("peek");
      p.t0 = performance.now(); p.d0 = d;
      if (p.name === "qs" && p.opening) { base = S.view; $("v-" + base).classList.add("under"); }
      $("frost").style.transition = "none";
    }
    const f = Math.min(1, d / OPEN), q = p.opening ? f : 1 - f;
    p.f = f; p.dd = d;
    el.style.setProperty("--p", q); el.style.setProperty("--y", (1 - q) * dist + "px");
    $("frost").style.opacity = p.name === "qs" && base === "app" ? "" : q;
  });
  const end = () => {
    if (!p || !p.live) { p = null; return; }
    const { name, opening, f, dd, t0 } = p, el = $("v-" + name), fast = dd / Math.max(1, performance.now() - t0) > .45;
    p = null;
    const done = f > .4 || fast;
    const stay = opening ? done : !done;              // finish where the finger was heading
    el.classList.remove("peek"); $("frost").style.transition = ""; $("frost").style.opacity = "";
    if (stay) { if (S.view !== name) go(name, true); else go(name, true); }
    else { $("v-" + base).classList.remove("under"); go(name === "qs" ? base : "home", true); }
  };
  SC.addEventListener("pointerup", end); SC.addEventListener("pointercancel", end);
  SC.addEventListener("click", e => { if (swallow) { swallow = false; e.stopPropagation(); e.preventDefault(); } }, true);
})();

// Lock: swipe up
(function () {
  const L = $("v-lock"); let y0 = null;
  L.addEventListener("pointerdown", e => { y0 = e.clientY; L.setPointerCapture(e.pointerId); L.style.transition = "none"; });
  L.addEventListener("pointermove", e => { if (y0 === null) return; const d = Math.min(0, e.clientY - y0); L.style.transform = `translateY(${d}px)`; L.style.opacity = 1 + d / 300; });
  const end = e => { if (y0 === null) return; const d = e.clientY - y0; y0 = null; L.style.transition = ""; L.style.transform = ""; L.style.opacity = ""; if (d < -70) go("pin"); };
  L.addEventListener("pointerup", end); L.addEventListener("pointercancel", end);
})();
// Recent apps: tap a card, or swipe it up
(function () {
  const V = $("v-recents"); let c = null, x0, y0, lift = false;
  V.addEventListener("pointerdown", e => { c = e.target.closest(".card"); x0 = e.clientX; y0 = e.clientY; lift = false; });
  V.addEventListener("pointermove", e => {
    if (!c) return; const dx = e.clientX - x0, dy = e.clientY - y0;
    if (!lift && dy < -12 && Math.abs(dy) > Math.abs(dx)) { lift = true; c.style.transition = "none"; }
    if (lift) { e.preventDefault(); c.style.transform = `translateY(${Math.min(0, dy)}px)`; c.style.opacity = 1 + dy / 420; }
  });
  const end = e => {
    if (!c) return; const card = c, dy = e.clientY - y0, dx = e.clientX - x0; c = null;
    card.style.transition = ""; card.style.opacity = "";
    if (lift && dy < -90) { card.style.transform = ""; card.classList.add("go"); const id = card.dataset.id; setTimeout(() => { opened = opened.filter(o => o !== id); renderRecents(); }, 230); return; }
    card.style.transform = "";
    if (!lift && Math.abs(dx) < 8 && Math.abs(dy) < 8) openApp(card.dataset.id);
  };
  V.addEventListener("pointerup", end);
  V.addEventListener("pointercancel", () => { if (c) { c.style.transform = ""; c.style.opacity = ""; c = null; } });
})();
$("copy").onclick = async () => {
  const b = $("copy");
  try { await navigator.clipboard.writeText(picks()); b.textContent = "Copied"; }
  catch (e) { const r = document.createRange(); r.selectNodeContents($("picks")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "Selected"; }
  setTimeout(() => (b.textContent = "Copy"), 1400);
};
// Fit the phone to the space
function fit() {
  const w = Math.min($("stage").clientWidth, 396 * 1.15), h = Math.max(innerHeight - 40, 520);
  const k = innerWidth <= 800 ? Math.min(w / 402, 1) : Math.min(w / 402, h / 770, 1.15);
  $("device").style.transform = `scale(${k})`;
  $("fit").style.width = 400 * k + "px"; $("fit").style.height = 770 * k + "px";
}
addEventListener("resize", fit); fit();
apply();
</script>

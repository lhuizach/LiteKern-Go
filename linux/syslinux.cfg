# LiteKern X on Linux: straight into Linux, no menu (linux/build.sh).
#   quiet loglevel=3      Linux's own messages stay off the screen (the Log app
#                         has the desktop's)
#   console=ttyS0 tty1    its messages on the serial port (the QEMU tests) and
#                         the screen
#   psmouse.proto=exps    the touchpad as a plain PS/2 mouse, as the kernel
#                         version drives it (its own tap-to-click)
DEFAULT litekernx
PROMPT 0
TIMEOUT 0
LABEL litekernx
    LINUX /syslinux/bzImage
    INITRD /syslinux/rootfs.gz
    APPEND quiet loglevel=3 console=ttyS0,115200 console=tty1 psmouse.proto=exps vt.global_cursor_default=0

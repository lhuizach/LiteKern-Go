# LiteKern Go: straight into Linux, no menu (linux/build.sh).
#   video=720x1280        the phone's portrait screen, in the VM
#   quiet loglevel=3      Linux's own messages stay off the screen (the Log app
#                         shows them)
#   console=ttyS0         its messages on the serial port (the QEMU tests), never
#                         the screen (the boot logo shows there)
# The system is built into the kernel (no INITRD), and these options are
# built in too (linux/kernel.config): the VM boots the same kernel from EFI.
# The touchpad gets Linux's own driver (fingers: platform/drm.c taps, moves
# and scrolls with two). If that ever goes wrong: hold Shift as the stick
# starts, and at "boot:" type  mouse  and Enter: the touchpad as a plain PS/2
# mouse (psmouse.proto=exps), as the kernel version drives it (no scrolling).
DEFAULT litekernx
PROMPT 0
TIMEOUT 0
LABEL litekernx
    LINUX /syslinux/bzImage
    APPEND quiet loglevel=3 console=ttyS0,115200 video=720x1280 vt.global_cursor_default=0
LABEL mouse
    LINUX /syslinux/bzImage
    APPEND quiet loglevel=3 console=ttyS0,115200 video=720x1280 psmouse.proto=exps vt.global_cursor_default=0

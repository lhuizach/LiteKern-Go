# LiteKern X on Linux: straight into Linux, no menu (linux/build.sh).
#   quiet loglevel=3      Linux's own messages stay off the screen (the Log app
#                         shows them)
#   console=ttyS0 tty1    its messages on the serial port (the QEMU tests) and
#                         the screen
# The touchpad gets Linux's own driver (fingers: platform/drm.c taps, moves
# and scrolls with two). If that ever goes wrong: hold Shift as the stick
# starts, and at "boot:" type  mouse  and Enter: the touchpad as a plain PS/2
# mouse (psmouse.proto=exps), as the kernel version drives it (no scrolling).
DEFAULT litekernx
PROMPT 0
TIMEOUT 0
LABEL litekernx
    LINUX /syslinux/bzImage
    INITRD /syslinux/rootfs.gz
    APPEND quiet loglevel=3 console=ttyS0,115200 console=tty1 vt.global_cursor_default=0
LABEL mouse
    LINUX /syslinux/bzImage
    INITRD /syslinux/rootfs.gz
    APPEND quiet loglevel=3 console=ttyS0,115200 console=tty1 psmouse.proto=exps vt.global_cursor_default=0
